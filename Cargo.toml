[package]
name = "papercuts"
version = "0.1.0"
edition = "2021"
description = "A tiny CLI that gives AI agents a complaint box."
license = "MIT"
repository = "https://github.com/dowhilelabs/papercut"

[[bin]]
name = "papercuts"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
jiff = "0.2"
fs2 = "0.4"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
predicates = "3"
