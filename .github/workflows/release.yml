name: release

# Build a single macOS Apple-silicon binary and attach it to a GitHub release.
# Trigger on any tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.

# Pin the release action by commit SHA (alias `_r`; env var is unused).
env:
  _r: &r softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust (aarch64-apple-darwin target)
        # dtolnay/rust-toolchain stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: aarch64-apple-darwin

      - name: Build release binary
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/papercut dist/papercut
          tar -C dist -czf papercut-aarch64-apple-darwin.tar.gz papercut
          shasum -a 256 papercut-aarch64-apple-darwin.tar.gz \
            | awk '{print $1}' > papercut-aarch64-apple-darwin.sha256
          echo "SHA256: $(cat papercut-aarch64-apple-darwin.sha256)"

      - name: Attach to release
        uses: *r
        with:
          files: |
            papercut-aarch64-apple-darwin.tar.gz
            papercut-aarch64-apple-darwin.sha256
